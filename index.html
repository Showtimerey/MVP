<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess The Sport</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Title Section -->
  <header>
    <h1>Guess The Sport 🏀</h1>
  </header>

  <!-- Game Container -->
  <main>
    <!-- Dashes for the hidden word -->
    <div id="word-display"></div>

    <!-- Tries Tracker -->
    <div id="tries-display">Tries Left: <span id="tries-count">3</span></div>

    <!-- On-Screen Keyboard -->
    <div id="keyboard"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
